      #loader { position: fixed; inset: 0; z-index: 10; background: #D9E8FF; overflow: hidden; font-family: NunitoBoot, system-ui, sans-serif; font-weight: 900;
                transition: opacity .35s ease; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader #sky { position: absolute; inset: 0; }
      #loader .cloud { position: absolute; width: 120px; height: 40px; animation: bootdrift 9s ease-in-out infinite alternate; }
      #loader .cloud i { position: absolute; background: #E8F1FF; border-radius: 50%; }
      #loader .cloud i:nth-child(1) { left: 0; bottom: 0; width: 46px; height: 30px; }
      #loader .cloud i:nth-child(2) { left: 26px; bottom: 0; width: 70px; height: 40px; }
      #loader .cloud i:nth-child(3) { left: 78px; bottom: 0; width: 42px; height: 28px; }
      @keyframes bootdrift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
      #loader #stage { position: absolute; left: 50%; top: 50%; width: 390px; height: 844px; margin: -422px 0 0 -195px; transform-origin: 50% 50%; }
      #loader .logo { position: absolute; left: 0; right: 0; top: 60px; text-align: center; line-height: 1; }
      #loader .logo b { display: block; font-weight: 900; font-size: 78px; letter-spacing: -.01em; color: #98CC24; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 #4B891E; }
      #loader .logo em { display: inline-block; margin-top: 14px; font-style: normal; font-size: 23px; line-height: 1; color: #26305C; background: #fff; border-radius: 999px; padding: 9px 20px 10px; letter-spacing: .01em; }
      #loader .pct { position: absolute; left: 0; right: 0; top: 546px; font-size: 66px; text-align: center; color: #26305C; line-height: 1; font-weight: 900; }
      #loader .pct small { display: block; margin-top: 6px; font-size: 19px; color: #5A6690; letter-spacing: .02em; }
      #loader .shadow { position: absolute; left: 62px; top: 492px; width: 266px; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(26,35,80,.26), rgba(26,35,80,0)); }
      #loader #jarBox { position: absolute; left: 55px; top: 204px; width: 280px; height: 303px; }
      #loader #jarBox > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      #loader #ghost { filter: brightness(0) invert(1) opacity(.62); }
      #loader #hint { opacity: .12; filter: grayscale(1); }
      #loader #full { -webkit-mask-image: linear-gradient(to top, #000 0, #000 var(--f,0%), transparent calc(var(--f,0%) + 5%)); mask-image: linear-gradient(to top, #000 0, #000 var(--f,0%), transparent calc(var(--f,0%) + 5%)); }
      #loader #jarBox.pop { animation: bootpop .5s ease-out; }
      @keyframes bootpop { 0% { transform: scale(1); } 35% { transform: scale(1.07,.95); } 70% { transform: scale(.97,1.04); } 100% { transform: scale(1); } }
      #loader #jarBox .spk { position: absolute; width: 24px; height: 24px; margin: -12px; background: #FFC531; top: 300px; visibility: hidden;
                             clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation: boottw 1.4s ease-in-out infinite; }
      @keyframes boottw { 0%,100% { transform: scale(.2) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
      #loader #om { position: absolute; left: 50%; bottom: 0; width: 266px; height: 182px; overflow: hidden; margin-left: -133px; transform: scale(var(--s,1)); transform-origin: 50% 100%; }
      #loader #om img { position: absolute; left: 50%; top: 6px; width: 236px; height: auto; margin-left: -118px; transform-origin: 50% 100%; animation: bootpeek 2.1s ease-in-out infinite; }
      #loader #om .joy { opacity: 0; }
      #loader.near #om .want { opacity: 0; }
      #loader.near #om .joy { opacity: 1; }
      @keyframes bootpeek { 0%,100% { transform: translateY(8px); } 50% { transform: translateY(-4px); } }
      #loader #fail { display: none; position: absolute; left: 24px; right: 24px; top: 546px; text-align: center; font: 900 20px/1.3 NunitoBoot, system-ui, sans-serif; color: #26305C; }
      #loader.fail #fail { display: block; cursor: pointer; }
      #loader.fail .pct, #loader.fail .spk { display: none; }
