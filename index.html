      window.omnomLoaderReady = function () { load.gameReady = true; };
      function paintLoader(now) {
        if (load.hidden) return;
        var dt = Math.min(0.1, (now - (load.last || now)) / 1000);
        load.last = now;
        // ease towards the target (never past 0.97 before the engine says it is up)
        var goal = load.instanceReady ? 1 : Math.min(0.97, load.target);
        load.shown += (goal - load.shown) * Math.min(1, dt * 5);
        if (goal - load.shown < 0.0005) load.shown = goal;
        loaderFill.style.width = (load.shown * 100) + "%";
        loaderCandy.style.left = (load.shown * 100) + "%";
        loaderCandy.style.transform = "rotate(" + Math.round(load.shown * 900) + "deg)";
        loader.setAttribute("aria-valuenow", Math.round(load.shown * 100));
        if (load.shown >= 1 && !loader.classList.contains("eat")) { loader.classList.add("eat"); load.readyAt = now; }
        // gone when the game is ready (after Om Nom had a moment with the candy); 30 s after the bar is full in any case
        if (load.readyAt && ((load.gameReady && now - load.readyAt > 450) || now - load.readyAt > 30000)) {
          load.hidden = true;
          loader.classList.add("done");
          setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 500);
          return;
        }
        requestAnimationFrame(paintLoader);
      }
      requestAnimationFrame(paintLoader);
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/web-final-20261004-fix.data.unityweb",
        frameworkUrl: "Build/web-final-20261004-fix.framework.js.unityweb",
        codeUrl: "Build/web-final-20261004-fix.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        // save.json lives in persistentDataPath (IndexedDB): synced by the engine after file writes
        autoSyncPersistentDataPath: true,
        companyName: "Studio",
        productName: "Om Nom Offline",
        productVersion: "0.1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        load.target = progress / 0.9;       // the engine reports 0..0.9 while loading and 1 when it starts
      }).then(function (unityInstance) {
        load.instanceReady = true;
        fitFrame();
        // test API on the page (Omnom.Shell.WebProbe + Plugins/WebGL/OmnomProbe.jslib), synchronous
        // window.__omnomState is the state JSON: a getter, because an act (and the real clock) only says that the state has a new version; the JSON is built when it is read
        Object.defineProperty(window, "__omnomState", { configurable: true, get: function () {
          if (window.__omnomStateVer !== window.__omnomVer) unityInstance.SendMessage("WebProbe", "Pull", "");
          return window.__omnomStateStr;
        } });
        window.__omnom = {
          ready: function () { unityInstance.SendMessage("WebProbe", "Pull", ""); return window.__omnomReady === true; },
          state: function () { unityInstance.SendMessage("WebProbe", "Pull", ""); return JSON.parse(window.__omnomState || "{}"); },
          act: function (action, payload) {
            var p = payload == null ? null : (typeof payload === "string" ? payload : JSON.stringify(payload));
            unityInstance.SendMessage("WebProbe", "Act", JSON.stringify({ action: action, payload: p }));
            return JSON.parse(window.__omnomLastAct || "{}");
          },
        };
      }).catch(function (message) {
        console.error(message);
        loader.classList.add("fail");
        load.hidden = true;
      });
    </script>
