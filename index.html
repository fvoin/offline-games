        // without asking the server, so a game entered once opens again without network; the data file is checked with the server as before
        cacheControl: function (url) {
          if (/\/packs\/[a-z0-9_]+-[0-9a-f]{16}\.bundle$/.test(url)) return "immutable";
          if (url.match(/\.data/) || url.match(/\.bundle/)) return "must-revalidate";
          return "no-store";
        },
        // save.json lives in persistentDataPath (IndexedDB): synced by the engine after file writes
        autoSyncPersistentDataPath: true,
        companyName: "Studio",
        productName: "Om Nom Offline",
        productVersion: "0.1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        load.target = progress / 0.9;       // the engine reports 0..0.9 while loading and 1 when it starts
      }).then(function (unityInstance) {
        load.instanceReady = true;
        fitFrame();
        // test API on the page (Omnom.Shell.WebProbe + Plugins/WebGL/OmnomProbe.jslib), synchronous
        // window.__omnomState is the state JSON: a getter, because an act (and the real clock) only says that the state has a new version; the JSON is built when it is read
        Object.defineProperty(window, "__omnomState", { configurable: true, get: function () {
          if (window.__omnomStateVer !== window.__omnomVer) unityInstance.SendMessage("WebProbe", "Pull", "");
          return window.__omnomStateStr;
        } });
        window.__omnom = {
          ready: function () { unityInstance.SendMessage("WebProbe", "Pull", ""); return window.__omnomReady === true; },
          state: function () { unityInstance.SendMessage("WebProbe", "Pull", ""); return JSON.parse(window.__omnomState || "{}"); },
          act: function (action, payload) {
            var p = payload == null ? null : (typeof payload === "string" ? payload : JSON.stringify(payload));
            unityInstance.SendMessage("WebProbe", "Act", JSON.stringify({ action: action, payload: p }));
            return JSON.parse(window.__omnomLastAct || "{}");
          },
        };
      }).catch(function (message) {
        console.error(message);
        loader.classList.add("fail");
        load.hidden = true;
      });
    </script>
  </body>
</html>
