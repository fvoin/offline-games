      #loader { position: fixed; inset: 0; z-index: 10; background: #D9E8FF; overflow: hidden; font-family: NunitoBoot, system-ui, sans-serif; font-weight: 900;
                transition: opacity .35s ease; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader #sky { position: absolute; inset: 0; }
      #loader .cloud { position: absolute; width: 120px; height: 40px; animation: bootdrift 9s ease-in-out infinite alternate; }
      #loader .cloud i { position: absolute; background: #E8F1FF; border-radius: 50%; }
      #loader .cloud i:nth-child(1) { left: 0; bottom: 0; width: 46px; height: 30px; }
      #loader .cloud i:nth-child(2) { left: 26px; bottom: 0; width: 70px; height: 40px; }
      #loader .cloud i:nth-child(3) { left: 78px; bottom: 0; width: 42px; height: 28px; }
      @keyframes bootdrift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
      #loader #stage { position: absolute; left: 50%; top: 50%; width: 390px; height: 844px; margin: -422px 0 0 -195px; transform-origin: 50% 50%; }
      #loader .logo { position: absolute; left: 0; right: 0; top: 54px; text-align: center; line-height: 0; }
      #loader .logo img { display: block; width: 240px; height: auto; margin: 0 auto; }
      #loader .pct { position: absolute; left: 0; right: 0; top: 546px; font-size: 66px; text-align: center; color: #26305C; line-height: 1; font-weight: 900; }
      #loader .pct small { display: block; margin-top: 6px; font-size: 19px; color: #5A6690; letter-spacing: .02em; }
      /* tips under the percent (task 696): fade .3 s out, swap, fade .3 s in; the icon is a plain vector shape in the text colour */
      #loader .pct small { height: 25px; line-height: 25px; white-space: nowrap; opacity: 1; transition: opacity .3s ease; }
      #loader .pct small svg { display: inline-block; width: 20px; height: 20px; margin: -3px 6px 0 0; vertical-align: middle; }
      #loader .shadow { position: absolute; left: 62px; top: 492px; width: 266px; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(26,35,80,.26), rgba(26,35,80,0)); }
      #loader #jarBox { position: absolute; left: 55px; top: 204px; width: 280px; height: 303px; }
      #loader #jarBox > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      #loader #ghost { filter: brightness(0) invert(1) opacity(.62); }
      #loader #hint { opacity: .12; filter: grayscale(1); }
      #loader #full { -webkit-mask-image: linear-gradient(to top, #000 0, #000 var(--f,0%), transparent calc(var(--f,0%) + 5%)); mask-image: linear-gradient(to top, #000 0, #000 var(--f,0%), transparent calc(var(--f,0%) + 5%)); }
      #loader #jarBox.pop { animation: bootpop .5s ease-out; }
      @keyframes bootpop { 0% { transform: scale(1); } 35% { transform: scale(1.07,.95); } 70% { transform: scale(.97,1.04); } 100% { transform: scale(1); } }
      #loader #jarBox .spk { position: absolute; width: 24px; height: 24px; margin: -12px; background: #FFC531; top: 300px; visibility: hidden;
                             clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation: boottw 1.4s ease-in-out infinite; }
      @keyframes boottw { 0%,100% { transform: scale(.2) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
      #loader #om { position: absolute; left: 50%; bottom: 0; width: 266px; height: 182px; overflow: hidden; margin-left: -133px; transform: scale(var(--s,1)); transform-origin: 50% 100%; }
      #loader #om img { position: absolute; left: 50%; top: 6px; width: 236px; height: auto; margin-left: -118px; transform-origin: 50% 100%; animation: bootpeek 2.1s ease-in-out infinite; }
      #loader #om .joy { opacity: 0; }
      #loader.near #om .want { opacity: 0; }
      #loader.near #om .joy { opacity: 1; }
      @keyframes bootpeek { 0%,100% { transform: translateY(8px); } 50% { transform: translateY(-4px); } }
      #loader #fail { display: none; position: absolute; left: 24px; right: 24px; top: 546px; text-align: center; font: 900 20px/1.3 NunitoBoot, system-ui, sans-serif; color: #26305C; }
      #loader.fail #fail { display: block; cursor: pointer; }
      #loader.fail .pct, #loader.fail .spk { display: none; }
          </style>

    <script>
      // D-418 (QA-23 Q-9): the audio of the engine asks AudioContext.resume() every 400 ms from the start, and a page nobody has touched yet gets a Chrome warning each time.
      // Until the first touch / click / key the call does nothing and answers at once; the context is made as usual and starts with the first real gesture (the engine's own timer and listeners do the resume).
      // D-527 / D-559 (programmer-456, -493): and back from another tab / app / a locked screen. The engine takes its listeners off once the context runs and its timer stops, so a context the browser suspended
      // meanwhile (iOS Safari: "suspended" / "interrupted" after an app switch or a lock; Android Chrome and WebView after the tab was in the background) stayed mute for good. What is done here:
      //  1. every context the page makes is remembered; when the page is shown again (visibilitychange, pageshow, focus), when a context changes its state, and inside every touch / click / key (the gesture iOS wants:
      //     touchend / click; touchstart / pointerdown count for Chrome) the ones that do not run are resumed. "interrupted" (iOS) is handled like "suspended";
      //  2. the first gesture after the return also starts a silent one-sample buffer on the context (the iOS trick that wakes the output);
      //  3. a context that says "running" but whose clock does not move after the return (an iOS Safari bug after a lock / a call) is cycled suspend -> resume;
      //  4. when the engine wakes the music after the context ran again it restarts every looped buffer at "position + the whole time away"; a Safari that does not wrap a loop offset longer than the clip
      //     plays nothing, so the start offset of a looped buffer is wrapped into the loop here (what the spec does anyway: nothing changes in Chrome).

        }

          try { var src = c.createBufferSource(); src.buffer = c.createBuffer(1, 1, 22050); src.connect(c.destination); src.start(0); src.onended = function () { try { src.disconnect(); } catch (_) { } }; } catch (_) { }
        }

          for (var i = 0; i < ctxs.length; i++) {
            var c = ctxs[i];

            if (c.state !== "running") { try { var p = c.resume(); if (p && p.catch) p.catch(noop); } catch (_) { } }
            else if (c.__stuck && (gesture || !document.hidden)) { c.__stuck = false; kick(c); }

        }

        function mark() { touched = true; wake(true); }

        window.addEventListener("pageshow", wakeSoon);
        window.addEventListener("focus", wakeSoon);

        }

    <script>
      // loading screen B: window.render(p) draws the jar (p 0..1, already smoothed by paintLoader below); bootFit() scales the 390x844 column to the window
      (function () {
        var boot = document.getElementById("loader"), stage = document.getElementById("stage"), num = document.getElementById("num"), jar = document.getElementById("jarBox"), full = document.getElementById("full");
        var sparks = jar.querySelectorAll(".spk"), popped = false;
        document.getElementById("ghost").src = full.src; document.getElementById("hint").src = full.src;
        window.render = function (p) {
          var f = Math.round(p * 1000) / 10;                       // jar fill, 0..100 % of its height
          full.style.setProperty("--f", (f * 0.97 + (p > 0 ? 3 : 0)) + "%");
          var ty = Math.max(14, 303 - (f * .01 * 270 + 18));
          for (var i = 0; i < sparks.length; i++) { sparks[i].style.top = (ty + (i == 1 ? -34 : i * 10)) + "px"; sparks[i].style.visibility = (p > .06 && p < .97) ? "visible" : "hidden"; }
          num.textContent = Math.round(p * 100) + "%"; boot.setAttribute("aria-valuenow", Math.round(p * 100));
          boot.classList.toggle("near", p >= .9);
          if (p >= .999 && !popped) { popped = true; jar.classList.add("pop"); }
        };
        function bootFit() { var s = Math.min(innerWidth / 390, innerHeight / 844); stage.style.transform = "scale(" + s + ")"; boot.style.setProperty("--s", s); }
        bootFit(); addEventListener("resize", bootFit); addEventListener("orientationchange", bootFit);
        window.render(0);
        // tips under the percent (task 696): round and round, every 2.5 s, "No Wi-Fi needed" first. On the first visit (the game really comes over the network: no service worker in charge yet)
        // "No Wi-Fi needed" waits until the bar shows 80 %, the others run before; on a return visit (the worker serves the build from its store) it starts at once.
        var NOWIFI = '<svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="tipcut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="#000" stroke-width="5.6"/></mask></defs>'
          + '<g mask="url(#tipcut)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2.4 7.5A15 15 0 0 1 21.6 7.5"/><path d="M5.5 11.6A10.5 10.5 0 0 1 18.5 11.6"/><path d="M8.6 15.4A6 6 0 0 1 15.4 15.4"/></g>'
          + '<circle cx="12" cy="19" r="1.8" fill="currentColor"/><line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
        var TIPS = [{ html: NOWIFI + "No Wi-Fi needed", gate: .8 }, { html: "Play anywhere" }, { html: "Perfect for trips" }, { html: "New games every month" }];
        var tipEl = document.getElementById("tip"), tipIdx = -1, tipFresh = !(navigator.serviceWorker && navigator.serviceWorker.controller), tipBusy = false;
        function tipOk(i) { var L = window.__omnomLoader; return !TIPS[i].gate || !tipFresh || (L && L.shown >= TIPS[i].gate); }
        function tipPick() { for (var k = 1; k <= TIPS.length; k++) { var j = (tipIdx + k + TIPS.length) % TIPS.length; if (tipOk(j)) return j; } return tipIdx; }
        function tipSet(i) { tipIdx = i; tipEl.innerHTML = TIPS[i].html; }
        tipSet(tipFresh ? 1 : 0);
        var tipTimer = setInterval(function () {
          if (!boot.parentNode) { clearInterval(tipTimer); return; }
          var n = tipPick();
          if (n === tipIdx || tipBusy) return;
          tipBusy = true; tipEl.style.opacity = 0;
          setTimeout(function () { tipSet(n); tipEl.style.opacity = 1; tipBusy = false; }, 300);
        }, 2500);
        window.__omnomTip = function () { return tipEl.textContent; };
      })();

      var DEV = /[?&]dev(&|=|$)/.test(location.search);

      // Cache-Control: max-age=600, and every publish gives the build files new names and deletes the old ones: a page opened from the 10-minute-old cache asks for files that are gone (404)
      // and the engine never starts. One reload that goes around the cache fixes it (the browser then asks the server for the page): the first failure of a visit does exactly that,
      // and only a second failure inside 90 s shows the message. The marker lives in the address (_r=<time>), so it needs no storage and a new address is a new cache entry.
